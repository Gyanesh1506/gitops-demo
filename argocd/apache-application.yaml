
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apache
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Gyanesh1506/gitops-demo.git
    targetRevision: main
    path: apache

  destination:
    server: https://kubernetes.default.svc
    namespace: apache

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

